name: Keep Render Bot Alive 24/7

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Keep Render Service Awake
        run: |
          deadline=$((SECONDS + 20700))

          while (( SECONDS < deadline )); do
            if curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 \
              "https://bot-telegram-consulta.onrender.com/"; then
              echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') - Render online"
            else
              echo "::warning::Render indisponivel; nova tentativa em 4 minutos"
            fi

            sleep 240
          done
