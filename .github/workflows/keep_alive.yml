name: Keep Render Bot Alive 24/7

on:
  schedule:
    # Executa a cada 5 minutos 24 horas por dia
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: >-
          curl --fail --silent --show-error --location
          --retry 3 --retry-delay 5 --retry-all-errors --max-time 90
          "https://bot-telegram-consulta.onrender.com/"
